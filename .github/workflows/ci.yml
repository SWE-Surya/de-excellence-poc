name: CI

# Runs on every pull request to main, and on pushes to main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java (required by PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the package plus the CI tools we actually need.
          # We install pyspark directly (not databricks-connect) for local-style unit tests.
          pip install -e .
          pip install pytest pytest-cov ruff chispa "pyspark==3.5.3"

      - name: Ruff lint (COD-04)
        run: ruff check .

      - name: Ruff format check (COD-04)
        run: ruff format --check .

      - name: Run unit tests (COD-05)
        env:
          SPARK_LOCAL_IP: "127.0.0.1"
        run: pytest -v

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (COD-08)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}